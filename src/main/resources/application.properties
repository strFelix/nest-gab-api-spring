spring.application.name=nest-gab-api


# MongoDB configuration (uses environment variables injected by Docker Compose or CI)
# If MONGODB_URI is set it will be used, otherwise default to the docker-compose service
spring.data.mongodb.uri=${MONGODB_URI:mongodb://${MONGO_INITDB_ROOT_USERNAME:nestadmin}:${MONGO_INITDB_ROOT_PASSWORD:nest123}@mongo-db:27017/${MONGO_INITDB_DATABASE:nest}?authSource=admin}

jwt.secret=nest-gab-super-secret-key-that-is-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

logging.level.org.springframework.security=TRACE
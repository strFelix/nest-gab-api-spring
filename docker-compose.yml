services:
  mongo-db:
    image: mongo:7
    container_name: nest-mongo
    environment:
      # Root user for the Mongo instance; values should be set via env or CI secrets in production
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-nestadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-nest123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-nest}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
